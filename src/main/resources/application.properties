spring.application.name=daily

 #系統的預設 port 是 8080，透過下一行的設定可以改成 8083
#server.port=8083
# 設定資料庫連接
# 3306是連接 mysql 的 port；p12 是要連接的資料庫名稱
# rewriteBatchedStatements=true: 可以批次新增
spring.datasource.url=jdbc:mysql://localhost:3306/diary?serverTimezone=GMT%2B8&useSSL=false&rewriteBatchedStatements=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.show-sql=true

# Email
# \u9019\u662F Gmail \u7684 SMTP \u4E3B\u6A5F\u4F4D\u5740\u3002(\u56E0\u70BA\u662F\u7528Gmail\u5E33\u865F\u5BC4\u4FE1)
spring.mail.host=${SMTP_HOST}
# \u9019\u662F SMTP \u7528\u4F86\u5BC4\u4FE1\u7684 \u901A\u8A0A\u57E0\uFF08port\uFF09\uFF0C
spring.mail.port=587
# \u8981\u62FF\u4F86\u5BC4\u4FE1\u7684 email \u5E33\u865F
spring.mail.username=${SMTP_USER}
# \u8981\u62FF\u4F86\u5BC4\u4FE1\u7684 email \u5BC6\u78BC
# \u4F46\u7531\u65BC\u662F\u7528 Gmail \uFF0C\u4E0D\u80FD\u76F4\u63A5\u5BEB Gmail \u767B\u5165\u5BC6\u78BC\uFF01 Gmail \u4E0D\u5141\u8A31\u7B2C\u4E09\u65B9\u61C9\u7528\u76F4\u63A5\u7528\u5E33\u5BC6\u767B\u5165\u4F86\u5BC4\u4FE1\u3002
# \u56E0\u6B64\u9700\u5230 Gmail \u8A2D\u5B9A\u300C\u61C9\u7528\u7A0B\u5F0F\u5BC6\u78BC\u300D
# \u5148\u958B\u555F\u300C\u5169\u6B65\u9A5F\u9A57\u8B49\u300D\uFF0C\u4E26\u7528\u700F\u89BD\u5668\u641C\u5C0B Gmail \u61C9\u7528\u7A0B\u5F0F\u5BC6\u78BC\uFF0C\u4E26\u8A2D\u5B9A\u5373\u53EF\u7372\u5F97(\u56E0GOOGLE\u628A\u61C9\u7528\u7A0B\u5F0F\u5BC6\u78BC\u7D66\u96B1\u85CF\u4E86\uFF0C\u6B63\u5E38\u662F\u770B\u4E0D\u5230\u7684)
spring.mail.password=${SMTP_PASS}
# \u8868\u793A\u300CSMTP \u9A57\u8B49\u555F\u7528\u300D
spring.mail.properties.mail.smtp.auth=true
# \u793A\u300C\u555F\u7528 STARTTLS \u52A0\u5BC6\u50B3\u8F38\u300D
spring.mail.properties.mail.smtp.starttls.enable=true

